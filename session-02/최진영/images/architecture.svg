<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" width="860" height="660" font-family="'Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#232f3e"/></marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#879196"/></marker>
  </defs>

  <rect x="0" y="0" width="860" height="660" fill="#ffffff"/>

  <!-- 제목/범례 -->
  <text x="24" y="30" fill="#232f3e" font-size="16" font-weight="700">수강신청 포털 3-Tier · ap-northeast-2</text>
  <rect x="560" y="17" width="18" height="14" rx="2" fill="#ffffff" stroke="#232f3e" stroke-width="2"/>
  <text x="584" y="29" fill="#232f3e" font-size="12">실제 구축</text>
  <rect x="680" y="17" width="18" height="14" rx="2" fill="#ffffff" stroke="#879196" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="704" y="29" fill="#232f3e" font-size="12">설계만(점선)</text>

  <!-- 사용자 -->
  <rect x="376" y="48" width="108" height="36" rx="4" fill="#f2f3f3" stroke="#232f3e" stroke-width="1.5"/>
  <text x="430" y="71" fill="#232f3e" font-size="13" text-anchor="middle">학생 브라우저</text>

  <!-- VPC -->
  <rect x="30" y="100" width="800" height="540" rx="6" fill="none" stroke="#248814" stroke-width="2"/>
  <text x="44" y="120" fill="#248814" font-size="12" font-weight="700">VPC 10.0.0.0/16</text>

  <!-- AZ -->
  <text x="245" y="140" fill="#879196" font-size="12" text-anchor="middle" font-weight="600">AZ ap-northeast-2a</text>
  <text x="615" y="140" fill="#879196" font-size="12" text-anchor="middle" font-weight="600">AZ ap-northeast-2c</text>
  <line x1="430" y1="146" x2="430" y2="630" stroke="#d5dbdb" stroke-dasharray="4 4"/>

  <!-- IGW (네트워킹=보라) -->
  <rect x="378" y="150" width="104" height="32" rx="4" fill="#e9d5f5" stroke="#8c4fff" stroke-width="2"/>
  <text x="430" y="171" fill="#232f3e" font-size="12" text-anchor="middle">Internet Gateway</text>

  <!-- public 밴드 -->
  <rect x="48" y="196" width="764" height="72" rx="4" fill="#f2fcf0" stroke="#248814" stroke-width="1"/>
  <text x="60" y="213" fill="#248814" font-size="11" font-weight="600">public 서브넷 · 10.0.1.0/24 · 10.0.2.0/24</text>
  <!-- Public ALB (네트워킹=보라, 실선) -->
  <rect x="332" y="222" width="196" height="38" rx="4" fill="#e9d5f5" stroke="#8c4fff" stroke-width="2"/>
  <text x="430" y="245" fill="#232f3e" font-size="13" text-anchor="middle" font-weight="600">Public ALB · HTTP:80</text>

  <!-- WEB (컴퓨트=주황, 실선) -->
  <rect x="140" y="294" width="150" height="52" rx="4" fill="#ffe8d4" stroke="#ec7211" stroke-width="2"/>
  <text x="215" y="316" fill="#232f3e" font-size="13" text-anchor="middle" font-weight="600">WEB EC2</text>
  <text x="215" y="334" fill="#687078" font-size="11" text-anchor="middle">Nginx · t3.micro</text>
  <rect x="570" y="294" width="150" height="52" rx="4" fill="#ffe8d4" stroke="#ec7211" stroke-width="2"/>
  <text x="645" y="316" fill="#232f3e" font-size="13" text-anchor="middle" font-weight="600">WEB EC2</text>
  <text x="645" y="334" fill="#687078" font-size="11" text-anchor="middle">Nginx · t3.micro</text>
  <rect x="300" y="298" width="260" height="44" rx="4" fill="none" stroke="#ec7211" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="430" y="316" fill="#ec7211" font-size="12" text-anchor="middle" font-weight="600">WEB Auto Scaling Group</text>
  <text x="430" y="333" fill="#687078" font-size="10" text-anchor="middle">min 2 · max 4</text>

  <!-- Internal ALB (네트워킹=보라, 점선=설계) -->
  <rect x="332" y="372" width="196" height="34" rx="4" fill="#f3ecfb" stroke="#8c4fff" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="430" y="394" fill="#5a2db3" font-size="12" text-anchor="middle" font-weight="600">Internal ALB</text>

  <!-- app 밴드 -->
  <rect x="48" y="420" width="764" height="64" rx="4" fill="#f2fcf0" stroke="#248814" stroke-width="1"/>
  <text x="60" y="437" fill="#248814" font-size="11" font-weight="600">app 서브넷</text>
  <!-- APP (컴퓨트=주황, 점선=설계) -->
  <rect x="140" y="440" width="150" height="36" rx="4" fill="#fff3e8" stroke="#ec7211" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="215" y="463" fill="#232f3e" font-size="12" text-anchor="middle">APP EC2</text>
  <rect x="570" y="440" width="150" height="36" rx="4" fill="#fff3e8" stroke="#ec7211" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="645" y="463" fill="#232f3e" font-size="12" text-anchor="middle">APP EC2</text>
  <rect x="300" y="443" width="260" height="30" rx="4" fill="none" stroke="#ec7211" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="430" y="462" fill="#ec7211" font-size="10" text-anchor="middle">APP Auto Scaling Group</text>

  <!-- data 밴드 -->
  <rect x="48" y="498" width="764" height="118" rx="4" fill="#f2fcf0" stroke="#248814" stroke-width="1"/>
  <text x="60" y="515" fill="#248814" font-size="11" font-weight="600">data 서브넷</text>
  <!-- RDS (DB=파랑, 점선=설계) -->
  <rect x="140" y="524" width="226" height="72" rx="4" fill="#e3edfb" stroke="#2e73e8" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="253" y="552" fill="#232f3e" font-size="13" text-anchor="middle" font-weight="600">RDS MySQL</text>
  <text x="253" y="572" fill="#687078" font-size="11" text-anchor="middle">Multi-AZ</text>
  <!-- ElastiCache (DB=파랑, 점선=설계) -->
  <rect x="494" y="524" width="226" height="72" rx="4" fill="#e3edfb" stroke="#2e73e8" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="607" y="552" fill="#232f3e" font-size="13" text-anchor="middle" font-weight="600">ElastiCache Redis</text>
  <text x="607" y="572" fill="#687078" font-size="11" text-anchor="middle">세션 저장소</text>

  <!-- 실선 경로 -->
  <line x1="430" y1="84" x2="430" y2="148" stroke="#232f3e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="430" y1="182" x2="430" y2="220" stroke="#232f3e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="360" y1="260" x2="250" y2="292" stroke="#232f3e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="500" y1="260" x2="610" y2="292" stroke="#232f3e" stroke-width="2" marker-end="url(#ar)"/>
  <!-- 점선 경로 -->
  <line x1="215" y1="346" x2="360" y2="370" stroke="#879196" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ard)"/>
  <line x1="645" y1="346" x2="500" y2="370" stroke="#879196" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ard)"/>
  <line x1="400" y1="406" x2="250" y2="438" stroke="#879196" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ard)"/>
  <line x1="460" y1="406" x2="645" y2="438" stroke="#879196" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ard)"/>
  <line x1="215" y1="476" x2="253" y2="522" stroke="#879196" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ard)"/>
  <line x1="645" y1="476" x2="607" y2="522" stroke="#879196" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ard)"/>
</svg>
