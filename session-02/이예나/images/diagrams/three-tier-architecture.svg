<svg xmlns="http://www.w3.org/2000/svg" width="960" height="768" viewBox="0 0 960 768" role="img" aria-labelledby="title desc">
<title id="title">서비스 요청 흐름과 두 AZ의 기본 배치</title>
<desc id="desc">서울 리전 VPC 안의 두 AZ에 WEB과 APP을 배치한다. 사용자 요청은 Public ALB, WEB, Internal ALB를 거쳐 APP으로 전달된다. WEB ASG는 2~4대, APP ASG는 2~6대 범위이며 도식에는 기본 2대씩을 표시했다. 모든 APP은 공통 Valkey 세션 저장소와 같은 RDS 엔드포인트를 사용한다. RDS는 기본 DB에서 다른 AZ의 대기 DB로 동기 복제한다. 기본과 대기 역할은 장애 조치에 따라 바뀔 수 있다. 배포와 외부 통신 경로는 생략했다.</desc>
