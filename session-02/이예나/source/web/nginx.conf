user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 4096;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    log_format main '$time_iso8601 $http_x_forwarded_for "$request" $status $request_time $upstream_response_time';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        root /srv/portal/web/public;

        # 사용자 데이터가 부팅 때 값을 채운다.
        add_header X-Web-Instance "__WEB_INSTANCE__" always;

        # 내부 ALB의 IP는 바뀐다. 이름을 변수에 담아 10초마다 다시 조회한다.
        resolver 169.254.169.253 valid=10s;
        set $app_alb http://__APP_ALB__;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass $app_alb;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
