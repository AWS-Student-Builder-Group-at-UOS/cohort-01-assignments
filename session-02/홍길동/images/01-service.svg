<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 60 1040 560" role="img" aria-labelledby="title desc">
<title id="title">메모 저장 · 새로고침 · DB 조회</title>
<desc id="desc">과제 제출 샘플의 결과 요약 이미지입니다.</desc>
<rect width="1040" height="660" fill="#f4f7fb"/>
<g font-family="Malgun Gothic, Segoe UI, sans-serif">
<text x="32" y="105" font-size="16" font-weight="700" fill="#61718a">01  /  SESSION 02</text>
<rect x="924" y="85" width="84" height="28" rx="14" fill="#fef2c0" stroke="none"/>
<text x="966" y="105" text-anchor="middle" font-size="15" font-weight="600" fill="#735115">sample</text>
<text x="32" y="150" font-size="31" font-weight="700" fill="#172a43">메모 저장 · 새로고침 · DB 조회</text>
<text x="32" y="184" font-size="17" font-weight="400" fill="#61718a">ALB → EC2 → RDS 요청 흐름과 데이터 저장 확인</text>
<rect x="32" y="218" width="976" height="124" rx="14" fill="#ffffff" stroke="#dae2ed"/>
<text x="56" y="251" font-size="18" font-weight="400" fill="#61718a">http://notes.example.com</text>
<rect x="837" y="232" width="145" height="32" rx="16" fill="#e1f3ed" stroke="none"/>
<text x="857" y="255" font-size="17" font-weight="700" fill="#14644c">HTTP 200</text>
<text x="56" y="290" font-size="23" font-weight="700" fill="#172a43">나의 메모</text>
<text x="56" y="320" font-size="20" font-weight="400" fill="#172a43">#7   ASBG 첫 과제</text>
<text x="735" y="320" font-size="17" font-weight="400" fill="#61718a">새로고침 후에도 표시</text>
<rect x="32" y="365" width="976" height="214" rx="14" fill="#172a43" stroke="none"/>
<text x="56" y="401" font-size="18" font-weight="700" fill="#9fd9c6">RDS MySQL 조회 결과</text>
<text x="56" y="437" font-size="19" font-weight="400" fill="#edf3fa">SELECT id, body FROM notes WHERE id = 7;</text>
<rect x="56" y="459" width="928" height="1" rx="0" fill="#43536b" stroke="none"/>
<text x="56" y="494" font-size="18" font-weight="400" fill="#aabbd0">id</text>
<text x="205" y="494" font-size="18" font-weight="400" fill="#aabbd0">body</text>
<text x="56" y="533" font-size="22" font-weight="400" fill="#ffffff">7</text>
<text x="205" y="533" font-size="22" font-weight="400" fill="#ffffff">ASBG 첫 과제</text>
<text x="56" y="562" font-size="16" font-weight="400" fill="#9fd9c6">웹 화면과 DB의 ID · 내용이 일치</text>
</g>
</svg>
