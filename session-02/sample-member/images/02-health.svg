<text x="581" y="386" font-size="17" font-weight="700" fill="#52657d">포트 / 경로</text>
<text x="841" y="386" font-size="17" font-weight="700" fill="#52657d">상태</text>
<text x="56" y="446" font-size="21" font-weight="400" fill="#172a43">notes-app-a</text>
