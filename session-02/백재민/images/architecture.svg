<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1395" width="1100" height="1395" role="img" aria-label="수강신청 포털 3-Tier 아키텍처">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#37475A"/>
    </marker>
    <marker id="arwG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A7B0BA"/>
    </marker>

    <!-- ===== 그룹 아이콘 (AWS 그룹 표기) ===== -->
    <symbol id="g-cloud" viewBox="0 0 20 20">
      <g fill="#242F3E">
        <circle cx="7" cy="11.2" r="3.5"/>
        <circle cx="12.6" cy="9.6" r="4.3"/>
        <rect x="6" y="11.2" width="8.6" height="3.5" rx="1.75"/>
      </g>
    </symbol>
    <symbol id="g-region" viewBox="0 0 20 20">
      <rect x="2.2" y="2.2" width="15.6" height="15.6" rx="2" fill="none" stroke="#00A4A6" stroke-width="1.8" stroke-dasharray="3 2"/>
    </symbol>
    <symbol id="g-vpc" viewBox="0 0 20 20">
      <rect width="20" height="20" rx="3" fill="#8C4FFF"/>
      <rect x="5" y="5" width="10" height="10" rx="1.4" fill="none" stroke="#fff" stroke-width="1.5"/>
    </symbol>
    <symbol id="g-subnet" viewBox="0 0 20 20">
      <rect width="20" height="20" rx="3" fill="currentColor"/>
      <g fill="none" stroke="#fff" stroke-width="1.4">
        <path d="M4 8h12M4 12h12M8 4v12M12 4v12"/>
      </g>
    </symbol>
    <symbol id="g-asg" viewBox="0 0 20 20">
      <rect width="20" height="20" rx="3" fill="#ED7100"/>
      <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round">
        <path d="M15 8.2A5.5 5.5 0 1 0 15.6 12.4"/>
        <path d="M15.2 4.4v3.9h-3.9"/>
      </g>
    </symbol>

    <!-- ===== 서비스 아이콘 ===== -->
    <symbol id="i-users" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="5" fill="currentColor"/>
      <circle cx="16" cy="12.5" r="4.3" fill="#fff"/>
      <path d="M7 25.5c0-5 4-8.2 9-8.2s9 3.2 9 8.2z" fill="#fff"/>
    </symbol>
    <symbol id="i-igw" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="5" fill="currentColor"/>
      <g fill="none" stroke="#fff" stroke-width="1.7">
        <circle cx="16" cy="16" r="8.5"/>
        <path d="M7.5 16h17M16 7.5c3.2 3.4 3.2 13.6 0 17M16 7.5c-3.2 3.4-3.2 13.6 0 17"/>
      </g>
    </symbol>
    <symbol id="i-nat" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="5" fill="currentColor"/>
      <g fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 20.5h15M23 20.5l-5-5M23 20.5l-5 5"/>
        <path d="M24 11.5H9M9 11.5l5-5M9 11.5l5 5"/>
      </g>
    </symbol>
    <symbol id="i-vpce" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="5" fill="currentColor"/>
      <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="16" cy="16" r="3.2"/>
        <path d="M16 12.8V7M16 19.2V25M12.8 16H7M19.2 16H25"/>
        <circle cx="16" cy="6" r="1.6"/><circle cx="16" cy="26" r="1.6"/>
        <circle cx="6" cy="16" r="1.6"/><circle cx="26" cy="16" r="1.6"/>
      </g>
    </symbol>
    <symbol id="i-alb" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="5" fill="currentColor"/>
      <g fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round">
        <path d="M5 16h7M12 16l7-8M12 16h7M12 16l7 8"/>
      </g>
      <g fill="#fff">
        <circle cx="21.5" cy="8" r="2.4"/>
        <circle cx="21.5" cy="16" r="2.4"/>
        <circle cx="21.5" cy="24" r="2.4"/>
      </g>
    </symbol>
    <symbol id="i-ec2" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="5" fill="currentColor"/>
      <g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round">
        <rect x="9.5" y="9.5" width="13" height="13" rx="1.2"/>
        <path d="M13 6v3.5M16 6v3.5M19 6v3.5M13 22.5V26M16 22.5V26M19 22.5V26M6 13h3.5M6 16h3.5M6 19h3.5M22.5 13H26M22.5 16H26M22.5 19H26"/>
      </g>
    </symbol>
    <symbol id="i-rds" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="5" fill="currentColor"/>
      <g fill="none" stroke="#fff" stroke-width="1.7">
